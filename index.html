<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOPIN — People. Skills. Solutions.</title><meta name="description" content="LOOPIN connects people who need help with people who have the skills, resources, and knowledge to make things happen.">
<meta property="og:title" content="LOOPIN — Someone out there can help"><meta name="theme-color" content="#10151E"><link rel="icon" href="favicon.svg">
<style>
:root{--bg:#0d121a;--bg2:#141b26;--card:#1a2230;--ac:#D8FF65;--tx:#F5F7FA;--tx2:#9fb0c4;--bd:#2a3445;--err:#FF7777;--ok:#78D9A0;--glow:0 0 24px #d8ff6533}
@media(prefers-color-scheme:light){:root{--bg:#f3f6fa;--bg2:#fff;--card:#fff;--tx:#10151E;--tx2:#4a566a;--bd:#d9e0ea;--glow:0 4px 18px #10151e14}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,Geist,system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(700px 400px at 90% -5%,#d8ff6514,transparent),radial-gradient(600px 400px at -5% 30%,#85b7ff12,transparent)}
a{color:inherit}button,input,textarea,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{max-width:1180px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}header .w{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:.06em;text-decoration:none}.logo img{width:30px;height:30px}
.eq{display:flex;gap:4px;height:36px;align-items:flex-end;justify-content:center;margin-top:18px}.eq i{width:6px;background:var(--ac);border-radius:3px;height:8px;animation:eq 1s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}.eq i:nth-child(6){animation-delay:.75s}.eq i:nth-child(7){animation-delay:.9s}
.eq.mini{height:16px;margin:0}.eq.mini i{width:3px;animation-duration:.9s}@keyframes eq{0%,100%{height:6px}50%{height:100%}}
.btn{background:var(--ac);color:#10151E;border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .25s,opacity .2s}.btn:hover{box-shadow:var(--glow);transform:translateY(-1px)}.btn.g{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.g:hover{border-color:var(--ac)}.btn:disabled{opacity:.5}.btn:active{transform:scale(.96)}
h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.02;margin:0 0 18px;font-weight:800;letter-spacing:-.03em}h2{font-size:1.5rem;margin:0 0 16px;letter-spacing:-.01em}.sec{margin:26px 0 12px;color:var(--tx2);font-size:.85rem;text-transform:uppercase;letter-spacing:.1em}
.hero{padding:72px 0 56px;display:grid;gap:32px;grid-template-columns:1.2fr 1fr;align-items:center}@media(max-width:760px){.hero{grid-template-columns:1fr}}.hero p{color:var(--tx2);max-width:46ch;font-size:1.1rem}.hero svg{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) rotate(2deg)}}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
section.s{padding:40px 0;border-top:1px solid var(--bd)}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;transition:border-color .2s,transform .2s,box-shadow .25s}.grid>.card:hover,.chatrow:hover{border-color:#d8ff6566;transform:translateY(-2px);box-shadow:var(--glow)}.card h3{margin:0 0 6px;font-size:1.05rem}.card p{margin:0;color:var(--tx2)}
.meta{font-size:.82rem;color:var(--tx2)}.tag{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:1px 10px;font-size:.75rem;margin:6px 6px 0 0;color:var(--tx2)}.tag.tg{border-color:var(--ac);color:var(--ac)}.tag.ai{font-size:.65rem;padding:0 7px;opacity:.75}
input,textarea,select{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0 12px;transition:border-color .2s}input:focus,textarea:focus,select:focus{border-color:var(--ac);outline:none}label{font-size:.9rem;color:var(--tx2)}
.box{max-width:420px;margin:48px auto}.msg{padding:10px 12px;border-radius:12px;margin:0 0 12px;border:1px solid var(--bd)}.msg.e{color:var(--err);border-color:var(--err)}.msg.o{color:var(--ok);border-color:var(--ok)}
.layout{display:grid;grid-template-columns:210px 1fr;gap:28px;padding-top:22px}.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:4px}
.side button,.bot button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:10px 14px;color:var(--tx2);cursor:pointer;text-align:left;transition:background .2s,color .2s}.side button:hover{background:var(--card);color:var(--tx)}.side button[aria-selected=true],.bot button[aria-selected=true]{background:var(--card);color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
.bot{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.bot{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg2);border-top:1px solid var(--bd);overflow-x:auto;padding:4px}.bot button{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 12px;min-width:68px;align-items:center;box-shadow:none!important}body{padding-bottom:70px}}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar input{flex:1;min-width:160px;margin:0}.empty{text-align:center;padding:40px 16px;color:var(--tx2);border:1px dashed var(--bd);border-radius:18px}
footer{border-top:1px solid var(--bd);padding:28px 0;color:var(--tx2);font-size:.9rem;margin-top:40px}
#v>*{animation:up .4s cubic-bezier(.2,.8,.2,1) both}.grid>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.grid>:nth-child(2){animation-delay:.05s}.grid>:nth-child(3){animation-delay:.1s}.grid>:nth-child(4){animation-delay:.15s}.grid>:nth-child(5){animation-delay:.2s}.grid>:nth-child(n+6){animation-delay:.25s}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.sk{height:110px;background:linear-gradient(90deg,var(--card),var(--bg2),var(--card));background-size:200% 100%;animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}
#sp{position:fixed;inset:0;background:#0d121a;display:grid;place-items:center;z-index:99;transition:opacity .6s,visibility .6s}#sp.off{opacity:0;visibility:hidden}#sp>div{text-align:center;color:#F5F7FA;font-weight:800;letter-spacing:.2em}
#sp path{stroke-dasharray:130;stroke-dashoffset:130;animation:dr 1.2s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}#sp b{display:block;margin-top:14px;opacity:0;animation:up .6s .7s forwards}
.chat{display:flex;flex-direction:column;gap:8px;margin:16px 0;max-height:52vh;overflow-y:auto;padding:4px}.bub{max-width:80%;background:var(--card);border:1px solid var(--bd);border-radius:18px 18px 18px 4px;padding:8px 14px;align-self:flex-start;white-space:pre-wrap;word-break:break-word;animation:up .25s both}.bub.me{align-self:flex-end;background:var(--ac);color:#10151E;border-color:var(--ac);border-radius:18px 18px 4px 18px}.bub .meta{display:block;color:inherit;opacity:.65}
.bub img,.bub video{max-width:100%;border-radius:12px;margin:4px 0;display:block}.bub a{text-decoration:underline}.clip{cursor:pointer;font-size:1.3rem;padding:0 4px}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}.stat .n{font-size:2.2rem;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}.stat .l{color:var(--tx2)}.stat .s{font-size:.8rem;color:var(--tx2)}
.ch{display:flex;gap:4px;align-items:flex-end;height:160px;margin-top:14px}.ch .col{flex:1;display:flex;align-items:flex-end;gap:2px;height:100%;position:relative}.ch .col span{position:absolute;bottom:-20px;left:0;font-size:.65rem;color:var(--tx2)}.ch .b1,.ch .b2{flex:1;border-radius:4px 4px 0 0;min-height:2px;animation:gw .8s ease-out both;transform-origin:bottom}.ch .b1{background:var(--ac)}.ch .b2{background:#85B7FF}@keyframes gw{from{transform:scaleY(0)}}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;width:min(440px,92vw)}dialog::backdrop{background:#0009}.code{font-size:1.8rem;letter-spacing:.4em;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="sp"><div><svg width="96" height="96" viewBox="0 0 64 64"><path d="M20 38a12 12 0 1 1 8 11M44 26a12 12 0 1 1-8-11" fill="none" stroke="#D8FF65" stroke-width="4.5" stroke-linecap="round"/><circle cx="32" cy="32" r="4" fill="#F5F7FA"/></svg><b>LOOPIN</b><div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>
<header><div class="w"><a class="logo" href="/"><img src="favicon.svg" alt="">LOOPIN<span class="eq mini" aria-hidden="true"><i></i><i></i><i></i><i></i></span></a><div id="hnav" class="row" style="margin:0"></div></div></header>
<main id="app" class="w" aria-live="polite"></main>
<footer><div class="w">LOOPIN — People. Skills. Solutions. &nbsp;Meet in public places, protect personal details, and involve a trusted adult if you are under 18.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
const C=window.LOOPIN_CONFIG||{},$=s=>document.querySelector(s),app=$('#app'),hn=$('#hnav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Design and creativity','Technology and coding','Education and learning','Writing and communication','Business and projects','Repairs and practical skills','Events and volunteering','Everyday resources','Recommendations','Other'];
const ago=d=>{const m=(Date.now()-new Date(d))/6e4;return m<60?Math.max(1,~~m)+'m ago':m<1440?~~(m/60)+'h ago':~~(m/1440)+'d ago'};
const note=(t,k='e')=>`<p class="msg ${k}" role="alert">${esc(t)}</p>`,sk=n=>Array(n).fill('<div class="card sk"></div>').join('');
const ok=!!(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY);let db,user=null,prof=null,tab='news',ch=null,openChat=null;
const th=localStorage.getItem('loopin_theme');if(th)document.documentElement.dataset.theme=th;
const staff=()=>['admin','moderator'].includes(prof?.role);
const tagsH=t=>(t||[]).map(x=>`<span class="tag ${x=='ai'?'ai':x=='verified'||x=='trusted'?'tg':''}">${x=='ai'?'AI':x=='verified'?'✔ Verified':x=='trusted'?'★ Trusted':esc(x)}</span>`).join('');
const JOIN='*, requests(title,status,owner,profiles(display_name,tags)), profiles(display_name,tags)';
function ask(title,cb){const d=document.createElement('dialog');d.innerHTML=`<form method="dialog"><h3>${esc(title)}</h3><textarea rows="4" required maxlength="1000"></textarea><div class="row" style="margin:0"><button class="btn">Send</button><button type="button" class="btn g" value="x">Cancel</button></div></form>`;document.body.appendChild(d);d.showModal();
d.querySelector('[value=x]').onclick=()=>{d.close();d.remove()};d.querySelector('form').onsubmit=e=>{e.preventDefault();const v=d.querySelector('textarea').value.trim();d.close();d.remove();if(v)cb(v)}}
function landing(){hn.innerHTML=`<button class="btn g" id="li">Log in</button><button class="btn" id="su">Join LOOPIN</button>`;$('#li').onclick=()=>auth('in');$('#su').onclick=()=>auth('up');
app.innerHTML=`<div class="hero"><div><h1>Someone out there can help.</h1><p>LOOPIN connects people who need help with people who have the skills, resources, and knowledge to make things happen.</p><div class="row"><button class="btn" id="j">Join LOOPIN</button><a class="btn g" href="#how" style="text-decoration:none">How it works</a></div></div>
<svg viewBox="0 0 320 320" role="img" aria-label="Connected nodes forming a loop"><circle cx="160" cy="160" r="110" fill="none" stroke="#D8FF65" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/><g stroke="#303846" stroke-width="2"><path d="M160 50L255 215L65 215Z" fill="none"/><path d="M160 160L160 50M160 160L255 215M160 160L65 215"/></g><g fill="#202835" stroke="#D8FF65" stroke-width="3"><circle cx="160" cy="50" r="16"/><circle cx="255" cy="215" r="16"/><circle cx="65" cy="215" r="16"/></g><circle cx="160" cy="160" r="22" fill="#D8FF65"/></svg></div>
<section class="s" id="how"><h2>How it works</h2><div class="grid"><div class="card"><h3>Share what you need</h3><p>Post a request or offer a skill.</p></div><div class="card"><h3>Offer help</h3><p>A private chat opens instantly between you and the requester.</p></div><div class="card"><h3>Get it done</h3><p>Chat until the favor is complete, then mark it done.</p></div><div class="card"><h3>Build trust</h3><p>Staff can award Trusted and Verified tags.</p></div></div></section>`;$('#j').onclick=()=>auth('up')}
function auth(m){const up=m==='up';app.innerHTML=`<form class="box card" id="f"><h2>${up?'Create your account':'Log in'}</h2><div id="m"></div>${up?'<label>Display name<input name="name" required maxlength="60"></label>':''}<label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="pw" type="password" required minlength="8" autocomplete="${up?'new-password':'current-password'}"></label><button class="btn" style="width:100%">${up?'Create account':'Log in'}</button>${up?'':'<p><a href="#" id="fg">Forgot password?</a></p>'}<p class="meta">${up?'Have an account? <a href="#" id="sw">Log in</a>':'New here? <a href="#" id="sw">Create an account</a>'}</p></form>`;
$('#sw').onclick=e=>{e.preventDefault();auth(up?'in':'up')};if($('#fg'))$('#fg').onclick=e=>{e.preventDefault();forgot()};
$('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button.btn');b.disabled=true;const d=Object.fromEntries(new FormData(e.target));
const r=up?await db.auth.signUp({email:d.email,password:d.pw,options:{data:{name:d.name},emailRedirectTo:location.origin}}):await db.auth.signInWithPassword({email:d.email,password:d.pw});b.disabled=false;
if(r.error){if(/not confirmed/i.test(r.error.message))return linkSent(d.email);return $('#m').innerHTML=note(r.error.message)}if(up&&!r.data.session)linkSent(d.email)}}
function linkSent(email){app.innerHTML=`<div class="box card"><h2>Check your email</h2><p>We sent a verification link to ${esc(email)}. Click it, then log in.</p><div id="m"></div><button class="btn g" id="rs">Resend email</button></div>`;$('#rs').onclick=async()=>{const r=await db.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin}});$('#m').innerHTML=r.error?note(r.error.message):note('Email sent again.','o')}}
function newpw(){hn.innerHTML='';app.innerHTML=`<form class="box card" id="f"><h2>Choose a new password</h2><div id="m"></div><label>New password<input name="pw" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn" style="width:100%">Save password</button></form>`;$('#f').onsubmit=async e=>{e.preventDefault();const{error}=await db.auth.updateUser({password:e.target.pw.value});if(error)return $('#m').innerHTML=note(error.message);await loadProf();shell()}}
function verify(email,type,pw){const rec=type==='recovery';app.innerHTML=`<form class="box card" id="f"><h2>Enter your code</h2><p class="meta">We emailed a code to ${esc(email)}.</p><div id="m"></div><input class="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required aria-label="Code">${rec?'<label>New password<input name="pw" type="password" minlength="8" required autocomplete="new-password"></label>':''}<button class="btn" style="width:100%">${rec?'Reset password':'Verify'}</button><p><a href="#" id="rs">Resend code</a></p></form>`;
$('#rs').onclick=async e=>{e.preventDefault();const r=rec?await db.auth.resetPasswordForEmail(email):await db.auth.resend({type:'signup',email});$('#m').innerHTML=r.error?note(r.error.message):note('New code sent.','o')};
$('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.btn');b.disabled=true;const d=Object.fromEntries(new FormData(e.target));const r=await db.auth.verifyOtp({email,token:d.code.trim(),type});
if(r.error){b.disabled=false;return $('#m').innerHTML=note('That code is wrong or expired. '+r.error.message)}if(rec){const u=await db.auth.updateUser({password:d.pw});if(u.error){b.disabled=false;return $('#m').innerHTML=note(u.error.message)}}}}
function forgot(){app.innerHTML=`<form class="box card" id="f"><h2>Reset password</h2><div id="m"></div><label>Email<input name="email" type="email" required></label><button class="btn" style="width:100%">Email me a code</button></form>`;
$('#f').onsubmit=async e=>{e.preventDefault();const em=e.target.email.value;const{error}=await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin});if(error)return $('#m').innerHTML=note(error.message);$('#f').innerHTML='<h2>Check your email</h2><p>We sent you a password reset link. Open it on this device.</p>'}}
function intro(done){const S=[['Find your people','The right people are closer than you think.'],['Exchange your skills','Everyone has something valuable to offer.'],['Make an impact','Small acts create bigger change.']];let i=0;
const r=()=>{app.innerHTML=`<div class="box card" style="text-align:center;margin-top:70px"><svg width="90" height="90" viewBox="0 0 64 64"><path d="M20 38a12 12 0 1 1 8 11M44 26a12 12 0 1 1-8-11" fill="none" stroke="#D8FF65" stroke-width="4.5" stroke-linecap="round"/><circle cx="${32+i*4}" cy="32" r="4" fill="#F5F7FA"/></svg><h2 style="margin-top:14px">${S[i][0]}</h2><p>${S[i][1]}</p><p class="meta">${i+1} / 3</p><div class="row" style="justify-content:center"><button class="btn g" id="sk">Skip</button><button class="btn" id="nx">${i<2?'Next':'Get started'}</button></div></div>`;
$('#sk').onclick=done;$('#nx').onclick=()=>{if(i<2){i++;r()}else done()}};r()}
async function loadProf(){const{data}=await db.from('profiles').select('*').eq('id',user.id).single();prof=data}
function shell(){hn.innerHTML=`<span class="meta">${esc(prof?.display_name||user.email)}</span>${tagsH(prof?.tags)}<button class="btn g" id="lo">Log out</button>`;$('#lo').onclick=()=>db.auth.signOut();
const ICN={news:'<path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/>',requests:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',offers:'<path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7"/>',chats:'<path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/>',groups:'<path d="M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M21 20v-2a4 4 0 0 0-3-3.9"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6"/>',profile:'<path d="M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8"/>',mine:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',stats:'<path d="M5 21V10M12 21V3M19 21v-7"/>',staff:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'};const T=[['news','News'],['requests','Requests'],['offers','Offers'],['chats','Favors'],['groups','Messages'],['users','People'],['profile','Profile'],['mine','Activity']];if(staff())T.push(['stats','Analytics'],['staff','Staff']);
const nav=T.map(([k,l])=>`<button data-t="${k}" role="tab"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICN[k]}</svg><span>${l}</span></button>`).join('');
app.innerHTML=`<div class="layout"><aside class="side" role="tablist">${nav}</aside><div id="v"></div></div><nav class="bot" role="tablist">${nav}</nav>`;app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;view();scrollTo({top:0,behavior:'smooth'})});view()}
function view(){if(ch){db.removeChannel(ch);ch=null}app.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));({news,requests:()=>list('requests'),offers:()=>list('offers'),chats,groups,users,profile:profileP,mine,stats,staff:staffP})[tab]()}
const yt=u=>{const m=u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?'https://www.youtube.com/embed/'+m[1]:''};
const media=n=>!n.media_url?'':n.media_type==='youtube'?`<iframe src="${esc(yt(n.media_url))}" allowfullscreen loading="lazy" title="Video" style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:12px"></iframe>`:n.media_type==='video'?`<video src="${esc(n.media_url)}" controls preload="metadata" style="width:100%;border-radius:12px;margin-top:12px"></video>`:`<img src="${esc(n.media_url)}" alt="${esc(n.title)}" loading="lazy" style="width:100%;border-radius:12px;margin-top:12px">`;
async function news(){const v=$('#v');v.innerHTML=sk(2);const{data,error}=await db.from('news').select('*').order('created_at',{ascending:false}).limit(30);
if(error)return v.innerHTML=note(error.message);if(!data.length)return v.innerHTML='<div class="empty">No news yet. Announcements, photos and videos from the LOOPIN team will appear here.</div>';

async function upl(f){if(f.size>25e6)throw new Error('File must be under 25 MB.');const p=user.id+'/'+crypto.randomUUID()+'_'+f.name.replace(/[^\w.-]/g,'_'),u=await db.storage.from('chat').upload(p,f,{contentType:f.type||'application/octet-stream'});if(u.error)throw u.error;return{att_path:p,att_type:f.type.startsWith('image')?'image':f.type.startsWith('video')?'video':'file',att_name:f.name.slice(0,120)}}
async function hydrate(root){for(const a of root.querySelectorAll('[data-p]:not([data-d])')){a.dataset.d=1;const{data}=await db.storage.from('chat').createSignedUrl(a.dataset.p,3600);if(!data)continue;const u=esc(data.signedUrl),k=a.dataset.k;a.outerHTML=k==='image'?`<img src="${u}" alt="${esc(a.dataset.n)}" style="max-width:100%;border-radius:10px;display:block">`:k==='video'?`<video src="${u}" controls style="max-width:100%;border-radius:10px"></video>`:`<a href="${u}" target="_blank" rel="noopener">📄 ${esc(a.dataset.n)}</a>`}}
const FORM='<form id="cf" class="bar"><input id="ci" maxlength="2000" placeholder="Write a message" autocomplete="off" aria-label="Message"><label class="btn g" style="cursor:pointer" title="Send a photo, video or file">📎<input type="file" id="cf2" hidden accept="image/*,video/*,.pdf,.doc,.docx,.txt,.zip"></label><button class="btn">Send</button></form>';
async function profileP(){const v=$('#v');v.innerHTML=`<form class="card" id="pf2" style="max-width:560px"><h2>Your profile</h2><div id="m"></div><p>${tagsH(prof.tags)}</p><label>Display name<input name="display_name" required maxlength="60" value="${esc(prof.display_name)}"></label><label>About you<textarea name="bio" rows="3" maxlength="300">${esc(prof.bio||'')}</textarea></label><label>Skills (comma separated)<input name="skills" value="${esc((prof.skills||[]).join(', '))}"></label><button class="btn">Save</button></form>`;
$('#pf2').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const{data,error}=await db.from('profiles').update({display_name:d.display_name.trim(),bio:d.bio.trim(),skills:d.skills.split(',').map(x=>x.trim()).filter(Boolean).slice(0,15)}).eq('id',user.id).select().single();if(error)return $('#m').innerHTML=note(error.message);prof=data;$('#m').innerHTML=note('Saved.','o')}}
function managerPanel(){if(prof.role!=='admin')return;const O=[['stats','Show community stats'],['bots_on','Switch AI members on'],['bots_off','Pause AI members'],['level_low','Activity: quiet (150/day)'],['level_medium','Activity: normal (400/day)'],['level_high','Activity: busy (900/day)'],['tick_now','Run one round now'],['reset_window','Remove expired AI posts'],['clear_completed','Clear completed AI requests'],['reseed:100','Rebuild 100 AI members'],['reseed:1000','Rebuild 1000 AI members'],['reseed:5000','Rebuild 5000 AI members'],['remove_bots','Remove all AI members']];
$('#mg').innerHTML=`<h2 style="margin-top:32px">Manager</h2><div class="card"><label>Command<select id="mc">${O.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label><button class="btn" id="mr">Run</button><div id="mo" style="margin-top:10px"></div></div>`;
$('#mr').onclick=async()=>{const[c,a]=$('#mc').value.split(':');if(/^(reseed|remove_bots|clear_completed)/.test(c)&&!confirm('This deletes existing AI members or content. Continue?'))return;$('#mr').disabled=true;const{data,error}=await db.rpc('manager_run',{cmd:c,arg:+(a||0)});$('#mr').disabled=false;$('#mo').innerHTML=error?note(error.message):note(data,'o')}}
const att=m=>m&&m.file_path?`<div class="att" data-f="${esc(m.file_path)}" data-t="${esc(m.file_type)}" data-n="${esc(m.file_name||'file')}"><span class="meta">Loading…</span></div>`:'';
async function hydrate(el){for(const a of el.querySelectorAll('.att:not([data-h])')){a.dataset.h=1;const{data}=await db.storage.from('chat-files').createSignedUrl(a.dataset.f,3600);if(!data){a.textContent='File unavailable';continue}const u=esc(data.signedUrl);a.innerHTML=a.dataset.t==='image'?`<img src="${u}" alt="${esc(a.dataset.n)}" loading="lazy">`:a.dataset.t==='video'?`<video src="${u}" controls preload="metadata"></video>`:`<a href="${u}" target="_blank" rel="noopener">📎 ${esc(a.dataset.n)}</a>`}}
async function sendMsg(table,key,add){const i=$('#ci'),f=$('#cfile').files[0];const body=i.value.trim();if(!body&&!f)return;const row={...key,body:body||'📎 '+f.name};
if(f){if(f.size>25e6)return alert('Files must be under 25 MB.');const p=user.id+'/'+crypto.randomUUID()+'_'+f.name.replace(/[^\w.-]/g,'_');const u=await db.storage.from('chat-files').upload(p,f,{contentType:f.type});if(u.error)return alert(u.error.message);row.file_path=p;row.file_type=f.type.startsWith('image')?'image':f.type.startsWith('video')?'video':'file';row.file_name=f.name}
i.value='';$('#cfile').value='';const{data,error}=await db.from(table).insert(row).select().single();if(error){i.value=body;return alert(error.message)}add(data)}
async function stats(){const v=$('#v');v.innerHTML=sk(2);const{data:s,error}=await db.rpc('staff_stats');if(error)return v.innerHTML=note(error.message);const rate=s.requests?Math.round(s.completed/s.requests*100):0;
const C=[['Real people',s.people],['Requests',s.requests],['Completed',s.completed,rate+'% of requests'],['Offers',s.offers],['Help offered',s.chats]];
v.innerHTML=`<h2>Analytics</h2><div class="stats">${C.map(c=>`<div class="stat"><div class="n" data-n="${c[1]}">0</div><div class="l">${c[0]}</div>${c[2]?`<div class="s">${c[2]}</div>`:''}</div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>Last 24 hours</h3><div id="chart"><p class="meta">Loading…</p></div></div><p class="meta" style="margin-top:12px">Not included above: ${s.bots} automated members and ${s.bot_posts} automated posts.</p>`;
v.querySelectorAll('[data-n]').forEach(e=>{const t=+e.dataset.n;let c=0;const st=()=>{c+=Math.max(1,Math.ceil(t/30));if(c>=t){e.textContent=t;return}e.textContent=c;requestAnimationFrame(st)};t?st():e.textContent=0});
const{data:h,error:he}=await db.rpc('ai_hourly',{days:1});if(he)return $('#chart').innerHTML='<p class="meta">Hourly chart is available to admins.</p>';
const{data:z}=await db.from('ai_settings').select('timezone').eq('id',1).single(),tz=z?.timezone||'UTC',max=Math.max(1,...h.map(x=>Math.max(+x.ai_actions,+x.human_actions)));
$('#chart').innerHTML=`<div class="ch">${h.map((x,i)=>{let hh='';try{hh=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',timeZone:tz}).format(new Date(x.hr))}catch{}return`<div class="col" title="${hh}:00 · people ${x.human_actions} · automated ${x.ai_actions}"><div class="b1" style="height:${x.human_actions/max*100}%"></div><div class="b2" style="height:${x.ai_actions/max*100}%"></div><span>${i%3==0?hh:''}</span></div>`}).join('')}</div><p class="meta" style="margin-top:28px"><b style="color:var(--ac)">■</b> Real people &nbsp; <b style="color:#85B7FF">■</b> Automated · hours in ${esc(tz)}</p>`}
function setup(){app.innerHTML=`<div class="box card"><h2>Connect your Supabase project</h2><p>Put your project URL and anon key in <code>config.js</code> and redeploy. See README.md.</p></div>`}
const hideSp=()=>setTimeout(()=>$('#sp').classList.add('off'),1700);hideSp();
if(!ok){setup()}else{db=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
db.auth.onAuthStateChange((ev,s)=>{if(ev==='TOKEN_REFRESHED')return;if(ev==='PASSWORD_RECOVERY'){user=s.user;newpw();return}const u=s?.user||null;if(u&&user&&u.id===user.id)return;user=u;setTimeout(async()=>{if(!user){prof=null;return landing()}await loadProf();const k='loopin_intro_'+user.id;if(!localStorage.getItem(k)){localStorage.setItem(k,1);intro(shell)}else shell()},0)})}
</script></body></html>
