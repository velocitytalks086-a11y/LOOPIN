<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOPIN — People. Skills. Solutions.</title><meta name="description" content="LOOPIN connects people who need help with people who have the skills, resources, and knowledge to make things happen.">
<meta property="og:title" content="LOOPIN — Someone out there can help"><meta name="theme-color" content="#10151E"><link rel="icon" href="favicon.svg">
<style>
:root{--bg:#10151E;--bg2:#171E29;--card:#202835;--ac:#D8FF65;--tx:#F5F7FA;--tx2:#B6C0CE;--bd:#303846;--err:#FF7777;--ok:#78D9A0}
@media(prefers-color-scheme:light){:root{--bg:#F5F7FA;--bg2:#fff;--card:#fff;--tx:#10151E;--tx2:#475264;--bd:#D5DBE5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,Geist,system-ui,sans-serif}a{color:inherit}button,input,textarea,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{max-width:1040px;margin:0 auto;padding:0 20px}header{border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:3}header .w{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:.04em;text-decoration:none}.logo img{width:30px;height:30px}
.btn{background:var(--ac);color:#10151E;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .2s}.btn.g{background:none;color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.5}.btn:active{transform:scale(.97)}
h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.02;margin:0 0 18px;font-weight:800;letter-spacing:-.03em}h2{font-size:1.5rem;margin:0 0 16px}
.hero{padding:72px 0 56px;display:grid;gap:32px;grid-template-columns:1.2fr 1fr;align-items:center}@media(max-width:760px){.hero{grid-template-columns:1fr}}.hero p{color:var(--tx2);max-width:46ch;font-size:1.1rem}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
section.s{padding:40px 0;border-top:1px solid var(--bd)}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}.card h3{margin:0 0 6px;font-size:1.05rem}.card p{margin:0;color:var(--tx2)}
.meta{font-size:.82rem;color:var(--tx2)}.tag{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:1px 8px;font-size:.78rem;margin:6px 6px 0 0;color:var(--tx2)}.tag.tg{border-color:var(--ac);color:var(--ac)}
input,textarea,select{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:6px 0 12px}label{font-size:.9rem;color:var(--tx2)}
.box{max-width:420px;margin:48px auto}.msg{padding:10px 12px;border-radius:10px;margin:0 0 12px;border:1px solid var(--bd)}.msg.e{color:var(--err);border-color:var(--err)}.msg.o{color:var(--ok);border-color:var(--ok)}
nav.t{display:flex;gap:4px;margin:18px 0;overflow-x:auto;border-bottom:1px solid var(--bd)}nav.t button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--tx2);white-space:nowrap}nav.t button[aria-selected=true]{color:var(--tx);border-color:var(--ac)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar input{flex:1;min-width:160px;margin:0}.empty{text-align:center;padding:40px 16px;color:var(--tx2);border:1px dashed var(--bd);border-radius:14px}
footer{border-top:1px solid var(--bd);padding:28px 0;color:var(--tx2);font-size:.9rem;margin-top:40px}
#v>*{animation:up .35s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}}
.sk{height:110px;background:linear-gradient(90deg,var(--card),var(--bg2),var(--card));background-size:200% 100%;animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}
#sp{position:fixed;inset:0;background:#10151E;display:grid;place-items:center;z-index:99;transition:opacity .5s,visibility .5s}#sp.off{opacity:0;visibility:hidden}#sp div{text-align:center;color:#F5F7FA;font-weight:800;letter-spacing:.2em}
#sp path{stroke-dasharray:130;stroke-dashoffset:130;animation:dr 1.2s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}#sp b{display:block;margin-top:14px;opacity:0;animation:up .6s .7s forwards}
.chat{display:flex;flex-direction:column;gap:8px;margin:16px 0;max-height:52vh;overflow-y:auto}.bub{max-width:80%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 12px;align-self:flex-start;white-space:pre-wrap;word-break:break-word}.bub.me{align-self:flex-end;background:var(--ac);color:#10151E;border-color:var(--ac)}.bub .meta{display:block;color:inherit;opacity:.65}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;width:min(440px,92vw)}dialog::backdrop{background:#0009}
.code{font-size:1.8rem;letter-spacing:.4em;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="sp"><div><svg width="96" height="96" viewBox="0 0 64 64"><path d="M20 38a12 12 0 1 1 8 11M44 26a12 12 0 1 1-8-11" fill="none" stroke="#D8FF65" stroke-width="4.5" stroke-linecap="round"/><circle cx="32" cy="32" r="4" fill="#F5F7FA"/></svg><b>LOOPIN</b></div></div>
<header><div class="w"><a class="logo" href="/"><img src="favicon.svg" alt="">LOOPIN</a><div id="hnav" class="row" style="margin:0"></div></div></header>
<main id="app" class="w" aria-live="polite"></main>
<footer><div class="w">LOOPIN — People. Skills. Solutions. &nbsp;Meet in public places, protect personal details, and involve a trusted adult if you are under 18.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
const C=window.LOOPIN_CONFIG||{},$=s=>document.querySelector(s),app=$('#app'),hn=$('#hnav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Design and creativity','Technology and coding','Education and learning','Writing and communication','Business and projects','Repairs and practical skills','Events and volunteering','Everyday resources','Recommendations','Other'];
const ago=d=>{const m=(Date.now()-new Date(d))/6e4;return m<60?Math.max(1,~~m)+'m ago':m<1440?~~(m/60)+'h ago':~~(m/1440)+'d ago'};
const note=(t,k='e')=>`<p class="msg ${k}" role="alert">${esc(t)}</p>`,sk=n=>Array(n).fill('<div class="card sk"></div>').join('');
const ok=!!(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY);let db,user=null,prof=null,tab='news',ch=null,openChat=null;
const staff=()=>['admin','moderator'].includes(prof?.role);
const tagsH=t=>(t||[]).map(x=>`<span class="tag ${x=='verified'||x=='trusted'?'tg':''}">${x=='ai'?'🤖 AI member':x=='verified'?'✔ Verified':x=='trusted'?'★ Trusted':esc(x)}</span>`).join('');
const JOIN='*, requests(title,status,owner,profiles(display_name,tags)), profiles(display_name,tags)';
function ask(title,cb){const d=document.createElement('dialog');d.innerHTML=`<form method="dialog"><h3>${esc(title)}</h3><textarea rows="4" required maxlength="1000"></textarea><div class="row" style="margin:0"><button class="btn">Send</button><button type="button" class="btn g" value="x">Cancel</button></div></form>`;document.body.appendChild(d);d.showModal();
d.querySelector('[value=x]').onclick=()=>{d.close();d.remove()};d.querySelector('form').onsubmit=e=>{e.preventDefault();const v=d.querySelector('textarea').value.trim();d.close();d.remove();if(v)cb(v)}}
function landing(){hn.innerHTML=`<button class="btn g" id="li">Log in</button><button class="btn" id="su">Join LOOPIN</button>`;$('#li').onclick=()=>auth('in');$('#su').onclick=()=>auth('up');
app.innerHTML=`<div class="hero"><div><h1>Someone out there can help.</h1><p>LOOPIN connects people who need help with people who have the skills, resources, and knowledge to make things happen.</p><div class="row"><button class="btn" id="j">Join LOOPIN</button><a class="btn g" href="#how" style="text-decoration:none">How it works</a></div></div>
<svg viewBox="0 0 320 320" role="img" aria-label="Connected nodes forming a loop"><circle cx="160" cy="160" r="110" fill="none" stroke="#D8FF65" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/><g stroke="#303846" stroke-width="2"><path d="M160 50L255 215L65 215Z" fill="none"/><path d="M160 160L160 50M160 160L255 215M160 160L65 215"/></g><g fill="#202835" stroke="#D8FF65" stroke-width="3"><circle cx="160" cy="50" r="16"/><circle cx="255" cy="215" r="16"/><circle cx="65" cy="215" r="16"/></g><circle cx="160" cy="160" r="22" fill="#D8FF65"/></svg></div>
<section class="s" id="how"><h2>How it works</h2><div class="grid"><div class="card"><h3>Share what you need</h3><p>Post a request or offer a skill.</p></div><div class="card"><h3>Offer help</h3><p>A private chat opens instantly between you and the requester.</p></div><div class="card"><h3>Get it done</h3><p>Chat until the favor is complete, then mark it done.</p></div><div class="card"><h3>Build trust</h3><p>Staff can award Trusted and Verified tags.</p></div></div></section>`;$('#j').onclick=()=>auth('up')}
function auth(m){const up=m==='up';app.innerHTML=`<form class="box card" id="f"><h2>${up?'Create your account':'Log in'}</h2><div id="m"></div>${up?'<label>Display name<input name="name" required maxlength="60"></label>':''}<label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="pw" type="password" required minlength="8" autocomplete="${up?'new-password':'current-password'}"></label><button class="btn" style="width:100%">${up?'Create account':'Log in'}</button>${up?'':'<p><a href="#" id="fg">Forgot password?</a></p>'}<p class="meta">${up?'Have an account? <a href="#" id="sw">Log in</a>':'New here? <a href="#" id="sw">Create an account</a>'}</p></form>`;
$('#sw').onclick=e=>{e.preventDefault();auth(up?'in':'up')};if($('#fg'))$('#fg').onclick=e=>{e.preventDefault();forgot()};
$('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button.btn');b.disabled=true;const d=Object.fromEntries(new FormData(e.target));
const r=up?await db.auth.signUp({email:d.email,password:d.pw,options:{data:{name:d.name},emailRedirectTo:location.origin}}):await db.auth.signInWithPassword({email:d.email,password:d.pw});b.disabled=false;
if(r.error){if(/not confirmed/i.test(r.error.message))return linkSent(d.email);return $('#m').innerHTML=note(r.error.message)}if(up&&!r.data.session)linkSent(d.email)}}
function linkSent(email){app.innerHTML=`<div class="box card"><h2>Check your email</h2><p>We sent a verification link to ${esc(email)}. Click it, then log in.</p><div id="m"></div><button class="btn g" id="rs">Resend email</button></div>`;$('#rs').onclick=async()=>{const r=await db.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin}});$('#m').innerHTML=r.error?note(r.error.message):note('Email sent again.','o')}}
function newpw(){hn.innerHTML='';app.innerHTML=`<form class="box card" id="f"><h2>Choose a new password</h2><div id="m"></div><label>New password<input name="pw" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn" style="width:100%">Save password</button></form>`;$('#f').onsubmit=async e=>{e.preventDefault();const{error}=await db.auth.updateUser({password:e.target.pw.value});if(error)return $('#m').innerHTML=note(error.message);await loadProf();shell()}}
function verify(email,type,pw){const rec=type==='recovery';app.innerHTML=`<form class="box card" id="f"><h2>Enter your code</h2><p class="meta">We emailed a code to ${esc(email)}.</p><div id="m"></div><input class="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required aria-label="Code">${rec?'<label>New password<input name="pw" type="password" minlength="8" required autocomplete="new-password"></label>':''}<button class="btn" style="width:100%">${rec?'Reset password':'Verify'}</button><p><a href="#" id="rs">Resend code</a></p></form>`;
$('#rs').onclick=async e=>{e.preventDefault();const r=rec?await db.auth.resetPasswordForEmail(email):await db.auth.resend({type:'signup',email});$('#m').innerHTML=r.error?note(r.error.message):note('New code sent.','o')};
$('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.btn');b.disabled=true;const d=Object.fromEntries(new FormData(e.target));const r=await db.auth.verifyOtp({email,token:d.code.trim(),type});
if(r.error){b.disabled=false;return $('#m').innerHTML=note('That code is wrong or expired. '+r.error.message)}if(rec){const u=await db.auth.updateUser({password:d.pw});if(u.error){b.disabled=false;return $('#m').innerHTML=note(u.error.message)}}}}
function forgot(){app.innerHTML=`<form class="box card" id="f"><h2>Reset password</h2><div id="m"></div><label>Email<input name="email" type="email" required></label><button class="btn" style="width:100%">Email me a code</button></form>`;
$('#f').onsubmit=async e=>{e.preventDefault();const em=e.target.email.value;const{error}=await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin});if(error)return $('#m').innerHTML=note(error.message);$('#f').innerHTML='<h2>Check your email</h2><p>We sent you a password reset link. Open it on this device.</p>'}}
function intro(done){const S=[['Find your people','The right people are closer than you think.'],['Exchange your skills','Everyone has something valuable to offer.'],['Make an impact','Small acts create bigger change.']];let i=0;
const r=()=>{app.innerHTML=`<div class="box card" style="text-align:center;margin-top:70px"><svg width="90" height="90" viewBox="0 0 64 64"><path d="M20 38a12 12 0 1 1 8 11M44 26a12 12 0 1 1-8-11" fill="none" stroke="#D8FF65" stroke-width="4.5" stroke-linecap="round"/><circle cx="${32+i*4}" cy="32" r="4" fill="#F5F7FA"/></svg><h2 style="margin-top:14px">${S[i][0]}</h2><p>${S[i][1]}</p><p class="meta">${i+1} / 3</p><div class="row" style="justify-content:center"><button class="btn g" id="sk">Skip</button><button class="btn" id="nx">${i<2?'Next':'Get started'}</button></div></div>`;
$('#sk').onclick=done;$('#nx').onclick=()=>{if(i<2){i++;r()}else done()}};r()}
async function loadProf(){const{data}=await db.from('profiles').select('*').eq('id',user.id).single();prof=data}
function shell(){hn.innerHTML=`<span class="meta">${esc(prof?.display_name||user.email)}</span>${tagsH(prof?.tags)}<button class="btn g" id="lo">Log out</button>`;$('#lo').onclick=()=>db.auth.signOut();
const T=[['news','News'],['requests','Requests'],['offers','Offers'],['chats','Favor chats'],['groups','Messages'],['users','People'],['mine','My activity']];if(staff())T.push(['staff','Staff portal']);
app.innerHTML=`<nav class="t" role="tablist">${T.map(([k,l])=>`<button role="tab" data-t="${k}">${l}</button>`).join('')}</nav><div id="v"></div>`;app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;view()});view()}
function view(){if(ch){db.removeChannel(ch);ch=null}app.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));({news,requests:()=>list('requests'),offers:()=>list('offers'),chats,groups,users,mine,staff:staffP})[tab]()}
const yt=u=>{const m=u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?'https://www.youtube.com/embed/'+m[1]:''};
const media=n=>!n.media_url?'':n.media_type==='youtube'?`<iframe src="${esc(yt(n.media_url))}" allowfullscreen loading="lazy" title="Video" style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:12px"></iframe>`:n.media_type==='video'?`<video src="${esc(n.media_url)}" controls preload="metadata" style="width:100%;border-radius:12px;margin-top:12px"></video>`:`<img src="${esc(n.media_url)}" alt="${esc(n.title)}" loading="lazy" style="width:100%;border-radius:12px;margin-top:12px">`;
async function news(){const v=$('#v');v.innerHTML=sk(2);const{data,error}=await db.from('news').select('*').order('created_at',{ascending:false}).limit(30);
if(error)return v.innerHTML=note(error.message);if(!data.length)return v.innerHTML='<div class="empty">No news yet. Announcements, photos and videos from the LOOPIN team will appear here.</div>';
v.innerHTML=data.map(n=>`<article class="card" style="margin-bottom:14px"><span class="tag ${n.kind=='announcement'?'tg':''}">${esc(n.kind)}</span><h3 style="font-size:1.3rem;margin-top:8px">${esc(n.title)}</h3><p style="white-space:pre-wrap">${esc(n.body||'')}</p>${media(n)}<p class="meta" style="margin-top:10px">${ago(n.created_at)}</p></article>`).join('')}
async function list(kind){const v=$('#v'),isR=kind==='requests';let q='',cat='';
v.innerHTML=`<div class="bar"><input id="q" type="search" placeholder="Search ${kind}" aria-label="Search"><select id="c" style="width:auto;margin:0" aria-label="Category"><option value="">All categories</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn" id="new">${isR?'Post a request':'Offer your skills'}</button></div><div id="r" class="grid" style="margin-top:16px">${sk(3)}</div>`;
const run=async()=>{let x=db.from(kind).select('*, profiles(display_name,tags)').order('created_at',{ascending:false}).limit(30);x=isR?x.in('status',['open','responses_received','in_progress']):x.eq('active',true);if(cat)x=x.eq('category',cat);if(q)x=x.or(`title.ilike.%${q}%,description.ilike.%${q}%`);const{data,error}=await x,r=$('#r');
if(error)return r.innerHTML=`<div>${note(error.message)}<button class="btn g" id="rt">Retry</button></div>`,$('#rt').onclick=run;
if(!data.length)return r.innerHTML=`<div class="empty" style="grid-column:1/-1">${q||cat?'No matches. Clear the filters or try another keyword.':`No ${kind} yet. Be the first!`}</div>`;
r.innerHTML=data.map(i=>`<article class="card"><h3>${esc(i.title)}</h3><p>${esc(i.description.slice(0,140))}${i.description.length>140?'…':''}</p><span class="tag">${esc(i.category)}</span><span class="tag">${esc(i.assistance||i.arrangement)}</span><p class="meta" style="margin-top:10px">${esc(i.profiles?.display_name||'Member')} ${tagsH(i.profiles?.tags)} · ${ago(i.created_at)}</p>${isR&&i.owner!==user.id?((i.profiles?.tags||[]).includes('ai')?'<button class="btn" style="margin-top:10px" data-b="1">Offer help</button>':`<button class="btn" style="margin-top:10px" data-r="${i.id}">Offer help</button>`):''}</article>`).join('');
r.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>respond(b.dataset.r));r.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>alert('Someone is already helping this person.'))};
let t;$('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{q=e.target.value.trim().replace(/[,()%]/g,'');run()},300)};$('#c').onchange=e=>{cat=e.target.value;run()};$('#new').onclick=()=>form(kind);run()}
function form(kind){const isR=kind==='requests';$('#v').innerHTML=`<form class="card" id="nf" style="max-width:620px"><h2>${isR?'Post a request':'Offer your skills'}</h2><div id="m"></div><label>Title<input name="title" required minlength="5" maxlength="120"></label><label>Description<textarea name="description" rows="5" required></textarea></label><label>Category<select name="category">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label>${isR?'Type of assistance':'Arrangement'}<select name="${isR?'assistance':'arrangement'}"><option>free</option><option>exchange</option><option>advice</option><option>tutoring</option><option>volunteering</option><option>paid</option></select></label><label>Skills (comma separated)<input name="skills"></label><div class="row" style="margin:0"><button class="btn">Publish</button><button type="button" class="btn g" id="cx">Cancel</button></div></form>`;
$('#cx').onclick=view;$('#nf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.btn');b.disabled=true;const d=Object.fromEntries(new FormData(e.target));d.skills=(d.skills||'').split(',').map(s=>s.trim()).filter(Boolean);const{error}=await db.from(kind).insert(d);b.disabled=false;if(error)return $('#m').innerHTML=note(error.message);tab=kind;view()}}
function respond(id){ask('How can you help? (Keep personal details private.)',async message=>{const{data,error}=await db.from('request_responses').insert({request_id:id,message}).select(JOIN).single();
if(error)return alert(error.code==='23505'?'You already offered help on this request. Open Chats to continue.':error.message);openChat=data;tab='chats';view()})}
async function chats(){const v=$('#v');if(openChat){const r=openChat;openChat=null;return chat(r)}v.innerHTML=sk(2);const{data,error}=await db.from('request_responses').select(JOIN).order('created_at',{ascending:false});
if(error)return v.innerHTML=note(error.message);if(!data.length)return v.innerHTML='<div class="empty">No chats yet. Offer help on a request, or wait for someone to offer help on yours, and a private chat opens here.</div>';
v.innerHTML=data.map((r,i)=>`<button class="card" data-i="${i}" style="display:block;width:100%;text-align:left;margin-bottom:12px;cursor:pointer"><h3>${esc(r.requests.title)}</h3><p class="meta">with ${esc(other(r))} · ${esc(r.requests.status)} · ${ago(r.created_at)}</p></button>`).join('');v.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>chat(data[b.dataset.i]))}
const other=r=>r.responder===user.id?r.requests.profiles?.display_name:r.profiles?.display_name;
async function chat(r,ro){const v=$('#v'),isOwner=r.requests.owner===user.id,done=['completed','closed','cancelled'].includes(r.requests.status),seen=new Set(),bub=(b,w,t)=>`<div class="bub ${w===user.id?'me':''}">${esc(b)}<span class="meta">${ago(t)}</span></div>`;
v.innerHTML=`<button class="btn g" id="bk">← Chats</button><div class="card" style="margin-top:12px"><h3>${esc(r.requests.title)}</h3><p class="meta">with ${esc(other(r))} · ${esc(r.requests.status)}</p>${isOwner&&!done&&!ro?'<button class="btn" id="dn" style="margin-top:10px">Mark favor done</button>':''}</div><div id="ms" class="chat" aria-live="polite">${bub(r.message,r.responder,r.created_at)}</div>${ro?'<div class="empty">Admin view (read-only).</div>':done?'<div class="empty">This favor is finished, so the chat is closed.</div>':'<form id="cf" class="bar"><input id="ci" maxlength="2000" placeholder="Write a message" required autocomplete="off" aria-label="Message"><button class="btn">Send</button></form>'}`;
$('#bk').onclick=()=>{tab=ro?'staff':'chats';view()};const ms=$('#ms'),add=m=>{if(seen.has(m.id))return;seen.add(m.id);ms.insertAdjacentHTML('beforeend',bub(m.body,m.sender,m.created_at));ms.scrollTop=ms.scrollHeight};
if($('#dn'))$('#dn').onclick=async()=>{if(!confirm('Mark this favor as done? The chat will close.'))return;const{error}=await db.from('requests').update({status:'completed'}).eq('id',r.request_id);if(error)return alert(error.message);r.requests.status='completed';chat(r)};
const{data}=await db.from('messages').select('*').eq('response_id',r.id).order('created_at').limit(200);(data||[]).forEach(add);
if(done||ro)return;ch=db.channel('m'+r.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`response_id=eq.${r.id}`},p=>add(p.new)).subscribe();
$('#cf').onsubmit=async e=>{e.preventDefault();const i=$('#ci'),body=i.value.trim();if(!body)return;i.value='';const{data,error}=await db.from('messages').insert({response_id:r.id,body}).select().single();if(error){i.value=body;return alert(error.message)}add(data)}}
async function mine(){const v=$('#v');v.innerHTML=sk(2);const[a,b]=await Promise.all([db.from('requests').select('*').eq('owner',user.id).order('created_at',{ascending:false}),db.from('offers').select('*').eq('owner',user.id).order('created_at',{ascending:false})]);
const sec=(t,rows,f)=>`<h2 style="margin-top:24px">${t}</h2>${rows?.length?`<div class="grid">${rows.map(f).join('')}</div>`:`<div class="empty">Nothing here yet.</div>`}`;
v.innerHTML=sec('My requests',a.data,r=>`<div class="card"><h3>${esc(r.title)}</h3><p class="meta">${esc(r.status)} · ${ago(r.created_at)}</p>${['open','responses_received','in_progress'].includes(r.status)?`<button class="btn g" style="margin-top:10px" data-x="${r.id}">Close request</button>`:''}</div>`)+sec('My offers',b.data,o=>`<div class="card"><h3>${esc(o.title)}</h3><p class="meta">${o.active?'active':'paused'}</p><button class="btn g" style="margin-top:10px" data-p="${o.id}" data-a="${o.active}">${o.active?'Pause':'Resume'}</button></div>`);
v.querySelectorAll('[data-x]').forEach(x=>x.onclick=async()=>{await db.from('requests').update({status:'closed'}).eq('id',x.dataset.x);mine()});v.querySelectorAll('[data-p]').forEach(x=>x.onclick=async()=>{await db.from('offers').update({active:x.dataset.a!=='true'}).eq('id',x.dataset.p);mine()})}
async function staffP(){const v=$('#v');if(!staff())return v.innerHTML=note('Staff only.');
v.innerHTML=`<form class="card" id="pf" style="max-width:640px"><h2>Add to News</h2><div id="m"></div><label>Type<select name="kind"><option value="announcement">Announcement</option><option value="news">News</option><option value="photo">Photo</option><option value="video">Video</option></select></label><label>Title<input name="title" required minlength="3" maxlength="140"></label><label>Text<textarea name="body" rows="4"></textarea></label><label>Photo or video file<input name="file" type="file" accept="image/*,video/*"></label><label>Or YouTube link<input name="yt" type="url" placeholder="https://youtu.be/..."></label><button class="btn">Publish</button></form>
<h2 style="margin-top:32px">Tags</h2><div class="bar"><input id="uq" placeholder="Search username"><button class="btn g" id="us">Search</button></div><div id="ur" style="margin-top:12px"></div><h2 style="margin-top:32px">Posts</h2><div id="pl"></div><div id="cv"></div><div id="ai"></div>`;
monitor();aiPanel();const posts=async()=>{const{data}=await db.from('news').select('id,title,created_at').order('created_at',{ascending:false}).limit(20);$('#pl').innerHTML=(data||[]).map(n=>`<div class="card bar" style="margin-bottom:8px;justify-content:space-between"><span>${esc(n.title)}</span><button class="btn g" data-d="${n.id}">Delete</button></div>`).join('')||'<div class="empty">No posts.</div>';$('#pl').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this post?')){await db.from('news').delete().eq('id',b.dataset.d);posts()}})};posts();
$('#pf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.btn'),d=Object.fromEntries(new FormData(e.target)),f=e.target.file.files[0];b.disabled=true;const row={kind:d.kind,title:d.title,body:d.body};
if(f){if(f.size>50e6){b.disabled=false;return $('#m').innerHTML=note('File must be under 50 MB.')}const p=Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_'),u=await db.storage.from('news').upload(p,f,{contentType:f.type});if(u.error){b.disabled=false;return $('#m').innerHTML=note(u.error.message)}row.media_url=db.storage.from('news').getPublicUrl(p).data.publicUrl;row.media_type=f.type.startsWith('video')?'video':'image'}
else if(d.yt){if(!yt(d.yt)){b.disabled=false;return $('#m').innerHTML=note('That is not a valid YouTube link.')}row.media_url=d.yt;row.media_type='youtube'}
const{error}=await db.from('news').insert(row);b.disabled=false;if(error)return $('#m').innerHTML=note(error.message);e.target.reset();$('#m').innerHTML=note('Published.','o');posts()};
$('#us').onclick=async()=>{const q=$('#uq').value.trim().replace(/[,()%]/g,'');const{data}=await db.from('profiles').select('id,display_name,username,tags').ilike('username',`%${q}%`).limit(10);
$('#ur').innerHTML=(data||[]).map(u=>`<div class="card" style="margin-bottom:8px"><b>${esc(u.display_name)}</b> <span class="meta">@${esc(u.username)}</span><div class="row" style="margin-top:8px">${['trusted','verified','mentor','helper'].map(t=>`<button class="btn ${u.tags.includes(t)?'':'g'}" data-u="${u.id}" data-t="${t}" data-c="${u.tags.join(',')}">${t}</button>`).join('')}</div></div>`).join('')||'<div class="empty">No users found.</div>';
$('#ur').querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{const c=b.dataset.c?b.dataset.c.split(','):[],n=c.includes(b.dataset.t)?c.filter(x=>x!==b.dataset.t):[...c,b.dataset.t];const{error}=await db.rpc('set_tags',{uid:b.dataset.u,new_tags:n});if(error)return alert(error.message);$('#us').click()})}}
const GJ='*, group_members(user_id, profiles(display_name,tags))';
const gname=(g,all)=>g.is_dm?g.group_members.filter(m=>all||m.user_id!==user.id).map(m=>m.profiles?.display_name||'Member').join(' ↔ '):g.name;
async function groups(){const v=$('#v');v.innerHTML=sk(2);const{data,error}=await db.from('groups').select(GJ).order('created_at',{ascending:false});if(error)return v.innerHTML=note(error.message);

$('#ng').onclick=newGroup;v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>gchat(L[b.dataset.g]))}
async function newGroup(){const v=$('#v');v.innerHTML=`<form class="card" id="gf" style="max-width:560px"><h2>New group</h2><div id="m"></div><label>Group name<input name="name" required maxlength="60"></label><label>Find people<input id="gq" placeholder="Search by display name"></label><div id="gu" style="max-height:300px;overflow:auto"></div><div class="row"><button class="btn">Create group</button><button type="button" class="btn g" id="cx">Cancel</button></div></form>`;
const{data}=await db.from('profiles').select('id,display_name,username').neq('id',user.id).order('display_name').limit(200);
$('#gu').innerHTML=(data||[]).map(u=>`<label class="card" style="display:flex;gap:10px;align-items:center;margin-bottom:6px" data-n="${esc((u.display_name+' '+u.username).toLowerCase())}"><input type="checkbox" value="${u.id}" style="width:auto;margin:0"><span>${esc(u.display_name)} <span class="meta">@${esc(u.username)}</span></span></label>`).join('')||'<div class="empty">No other users yet.</div>';

async function openGroup(id){const{data}=await db.from('groups').select(GJ).eq('id',id).single();tab='groups';app.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));gchat(data)}
async function gchat(g,ro){const v=$('#v'),names={},seen=new Set();g.group_members.forEach(m=>names[m.user_id]=m.profiles?.display_name||'Member');
const bub=m=>`<div class="bub ${m.sender===user.id?'me':''}">${m.sender===user.id?'':`<span class="meta"><b>${esc(names[m.sender]||'Member')}</b></span>`}${esc(m.body)}<span class="meta">${ago(m.created_at)}</span></div>`;
v.innerHTML=`<button class="btn g" id="bk">← Back</button><div class="card" style="margin-top:12px"><h3>${esc(gname(g,ro))}</h3><p class="meta">${g.is_dm?'Direct message':esc(Object.values(names).join(', '))}</p></div><div id="ms" class="chat" aria-live="polite"></div>${ro?'<div class="empty">Admin view (read-only).</div>':'<form id="cf" class="bar"><input id="ci" maxlength="2000" placeholder="Write a message" required autocomplete="off" aria-label="Message"><button class="btn">Send</button></form>'}`;
$('#bk').onclick=()=>{tab=ro?'staff':'groups';view()};const ms=$('#ms'),add=m=>{if(seen.has(m.id))return;seen.add(m.id);ms.insertAdjacentHTML('beforeend',bub(m));ms.scrollTop=ms.scrollHeight};
const{data}=await db.from('group_messages').select('*').eq('group_id',g.id).order('created_at').limit(200);(data||[]).forEach(add);if(ro)return;
ch=db.channel('g'+g.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'group_messages',filter:`group_id=eq.${g.id}`},p=>add(p.new)).subscribe();
$('#cf').onsubmit=async e=>{e.preventDefault();const i=$('#ci'),body=i.value.trim();if(!body)return;i.value='';const{data,error}=await db.from('group_messages').insert({group_id:g.id,body}).select().single();if(error){i.value=body;return alert(error.message)}add(data)}}
async function users(){const v=$('#v');v.innerHTML=`<div class="bar"><input id="uq" type="search" placeholder="Find people by display name" aria-label="Find people"><label style="margin:0;white-space:nowrap"><input type="checkbox" id="ua" style="width:auto;margin:0 6px 0 0">Include AI members</label></div><div id="ul" class="grid" style="margin-top:16px">${sk(3)}</div>`;
const run=async()=>{const q=$('#uq').value.trim().replace(/[,()%]/g,'');let x=db.from('profiles').select('id,display_name,username,bio,tags').neq('id',user.id).order('display_name').limit(100);if(!$('#ua').checked)x=x.not('tags','cs','{ai}');if(q)x=x.ilike('display_name',`%${q}%`);const{data,error}=await x,l=$('#ul');
if(error)return l.innerHTML=note(error.message);if(!data.length)return l.innerHTML='<div class="empty" style="grid-column:1/-1">No people found.</div>';
l.innerHTML=data.map(u=>`<article class="card"><h3>${esc(u.display_name)}</h3><p class="meta">@${esc(u.username)}</p>${tagsH(u.tags)}<p style="margin-top:8px">${esc((u.bio||'').slice(0,100))}</p>${(u.tags||[]).includes('ai')?'':`<button class="btn" style="margin-top:10px" data-u="${u.id}">Message</button>`}</article>`).join('');
l.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{b.disabled=true;const{data:id,error}=await db.rpc('start_dm',{other:b.dataset.u});if(error){b.disabled=false;return alert(error.message)}openGroup(id)})};
let t;$('#uq').oninput=()=>{clearTimeout(t);t=setTimeout(run,300)};$('#ua').onchange=run;run()}
async function monitor(){if(prof.role!=='admin')return;const el=$('#cv');el.innerHTML='<h2 style="margin-top:32px">All conversations</h2>'+sk(1);
const[a,b]=await Promise.all([db.from('request_responses').select(JOIN).order('created_at',{ascending:false}).limit(50),db.from('groups').select(GJ).order('created_at',{ascending:false}).limit(50)]);
const rows=[...(a.data||[]).map(r=>['Favor: '+r.requests.title+' — '+(r.profiles?.display_name||'?')+' ↔ '+(r.requests.profiles?.display_name||'?'),()=>chat(r,true)]),...(b.data||[]).map(g=>[(g.is_dm?'DM: ':'Group: ')+gname(g,true),()=>gchat(g,true)])];

async function aiPanel(){if(prof.role!=='admin')return;const el=$('#ai');const{data:s}=await db.from('ai_settings').select('*').eq('id',1).single();if(!s)return el.innerHTML=note('Run supabase/upgrade3.sql to enable AI activity.');
const[h,t]=await Promise.all([db.rpc('ai_hourly',{days:1}),db.rpc('ai_today',{tz:s.timezone})]);const rows=h.data||[],max=Math.max(1,...rows.map(x=>Math.max(+x.ai_actions,+x.human_actions)));
const fmt=d=>{try{return new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:s.timezone}).format(new Date(d))}catch{return''}},b=(w,c)=>`<div style="height:8px;margin:2px 0;background:var(--bd);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${w}%;background:${c}"></i></div>`;
el.innerHTML=`<h2 style="margin-top:32px">AI community activity</h2><div class="card"><p class="meta">AI members are always labelled and never counted as real people. Real users cannot start chats with them. Off by default. Runs inside the database every 10 minutes.</p><p><b>${t.data??0}</b> AI profiles active today</p><label><input type="checkbox" id="ae" ${s.enabled?'checked':''} style="width:auto;margin:0 8px 0 0">Enabled</label><label>Time zone<input id="az" value="${esc(s.timezone)}"></label><label>Actions per day<input id="ad" type="number" min="0" max="3000" value="${s.daily_actions}"></label><button class="btn" id="as">Save</button><div id="am" style="margin-top:10px"></div></div><h3 style="margin-top:20px">Last 24 hours · <span style="color:var(--ac)">AI</span> · <span style="color:#85B7FF">real people</span></h3>${rows.map(x=>`<div class="meta" style="display:flex;gap:8px;align-items:center"><span style="width:44px">${fmt(x.hr)}</span><div style="flex:1">${b(x.ai_actions/max*100,'var(--ac)')}${b(x.human_actions/max*100,'#85B7FF')}</div><span style="width:150px">AI ${x.ai_actions} (${x.ai_profiles}) · people ${x.human_actions}</span></div>`).join('')}`;
$('#as').onclick=async()=>{const tz=$('#az').value.trim();try{new Intl.DateTimeFormat('en',{timeZone:tz})}catch{return $('#am').innerHTML=note('Unknown time zone, e.g. Africa/Johannesburg.')}const{error}=await db.from('ai_settings').update({enabled:$('#ae').checked,timezone:tz,daily_actions:+$('#ad').value}).eq('id',1);$('#am').innerHTML=error?note(error.message):note('Saved.','o')}}

db.auth.onAuthStateChange((ev,s)=>{if(ev==='TOKEN_REFRESHED')return;if(ev==='PASSWORD_RECOVERY'){user=s.user;newpw();return}const u=s?.user||null;if(u&&user&&u.id===user.id)return;user=u;setTimeout(async()=>{if(!user){prof=null;return landing()}await loadProf();const k='loopin_intro_'+user.id;if(!localStorage.getItem(k)){localStorage.setItem(k,1);intro(shell)}else shell()},0)})}
